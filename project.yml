name: DotCleaner
options:
  bundleIdPrefix: com.illya.dotcleaner
  deploymentTarget:
    macOS: "13.0"

targets:
  DotCleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources/DotCleaner
    settings:
      base:
        PRODUCT_NAME: DotCleaner
        PRODUCT_BUNDLE_IDENTIFIER: com.illya.dotcleaner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
