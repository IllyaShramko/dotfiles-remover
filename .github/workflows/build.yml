name: Build DotCleaner.app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project DotCleaner.xcodeproj \
            -scheme DotCleaner \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Ensure AppIcon.icns is bundled
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1)
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          if [ ! -f "$RESOURCES_DIR/AppIcon.icns" ]; then
            echo "Generating AppIcon.icns via iconutil..."
            ICONSET_DIR=$(mktemp -d)/AppIcon.iconset
            mkdir -p "$ICONSET_DIR"
            cp Sources/DotCleaner/Assets.xcassets/AppIcon.appiconset/icon_*.png "$ICONSET_DIR/"
            rm -f "$ICONSET_DIR"/icon_dark_*.png
            iconutil -c icns "$ICONSET_DIR" -o "$RESOURCES_DIR/AppIcon.icns"
          fi
          ls -la "$RESOURCES_DIR"

      - name: Ad-hoc code sign app
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1)
          echo "Signing app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"

      - name: Locate and zip .app
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1)
          echo "Found app at: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" DotCleaner.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotCleaner-app
          path: DotCleaner.app.zip
